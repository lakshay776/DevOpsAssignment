# Added for this run (not in the course): hpa-backend.yaml and backend-service.yaml
# point at a Deployment called yatri-backend that the session never provides.
# This is a small stand-in so the Service, HPA and load_generator.sh can be tried:
# a Python HTTP server on port 5000 with a /healthz endpoint that does a little
# CPU work per request, so load shows up as CPU usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/healthz":
                          self.send_response(404); self.end_headers(); return
                      sum(i * i for i in range(300000))  # simulated work
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers(); self.wfile.write(body)
                  def log_message(self, *a): pass
              ThreadingHTTPServer(("", 5000), H).serve_forever()
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
