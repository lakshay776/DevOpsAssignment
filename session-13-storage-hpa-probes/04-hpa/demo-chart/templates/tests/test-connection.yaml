apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "demo-chart.fullname" . }}-test-connection"
  labels:
    {{- include "demo-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Delete the finished test Pod. It carries the same labels as the app Pods, so
    # if it is left behind the HPA selector matches it and, having no CPU request,
    # it makes the HPA report <unknown> ("missing request for cpu in container wget").
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "demo-chart.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
