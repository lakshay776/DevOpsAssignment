# Apply this file from your local/admin environment; do not put it under the Git source path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-app
  namespace: argocd
spec:
  project: default

  source:
    # Local Gitea on the kind Docker network stands in for GitHub (original: github.com/Nency-Ravaliya/gitops-demo).
    repoURL: http://gitea:3000/lakshay/gitops-demo.git
    targetRevision: main
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
