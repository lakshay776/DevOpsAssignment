apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-np
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-np
  template:
    metadata:
      labels:
        app: hello-np
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
