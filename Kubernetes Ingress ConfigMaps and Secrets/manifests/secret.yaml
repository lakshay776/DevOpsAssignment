# Secrets are base64-encoded, NOT encrypted - anyone who can read the object
# can decode them. `stringData` lets the value be written in plain text here
# and Kubernetes does the encoding on the way in.
#
# A real credential would never be committed to a public repo; this is a
# throwaway value for the exercise only.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "not-a-real-password"
