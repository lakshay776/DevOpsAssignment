# Deliberately broken: this tag does not exist on Docker Hub. Applying it
# gives a Pod stuck in ErrImagePull, then ImagePullBackOff, which is what
# `kubectl describe pod` is for reading.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken
  template:
    metadata:
      labels:
        app: broken
    spec:
      containers:
        - name: broken
          image: nginx:this-tag-does-not-exist
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
