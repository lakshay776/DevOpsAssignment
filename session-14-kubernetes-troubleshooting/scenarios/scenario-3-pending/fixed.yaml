apiVersion: v1
kind: Pod
metadata:
  name: fail-3-pending-pod
  labels:
    tier: triage-gauntlet
    scenario: pending
spec:
  containers:
    - name: hungry-app
      image: nginx:alpine
      resources:
        # FIX: request what nginx actually needs. 500 CPUs / 1000Gi can never fit on a node
        # (the kind node has 15 CPUs and ~7.7Gi allocatable), so the scheduler kept it Pending.
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          memory: "128Mi"
