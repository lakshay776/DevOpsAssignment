apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          # The loop really allocates 100 x 10 MiB = ~1000 MiB (the original comment says
          # 200MB, but range(100) makes it ~1 GiB). A 20Mi limit can never hold that, so the
          # kernel OOM-killed the container (exit code 137) on every start.
          print("Allocating memory rapidly...", flush=True)
          chunks = []
          for i in range(100):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print(f"Allocated {len(chunks) * 10} MiB without being OOMKilled", flush=True)
          # Keep running: with restartPolicy Always an exit 0 is restarted too.
          import time
          while True:
              time.sleep(3600)
      resources:
        # FIX: size the memory limit for what the workload really uses (~1000 MiB + Python).
        requests:
          memory: "1100Mi"
        limits:
          memory: "1200Mi"
