# Reference copy, kept here as part of this module's deliverables.
#
# GitHub only discovers workflows in <repo>/.github/workflows, so this nested
# copy is never triggered. The pipeline that actually runs is the equivalent
# at the repository root, .github/workflows/campusdesk-ci.yml, which builds
# this folder through working-directory and Docker build contexts.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Lowercased below: GHCR rejects uppercase characters in image names, and
  # GitHub usernames can contain them.
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        # Tests use SQLite, so no database service is needed here. A failure
        # fails the job and blocks everything downstream.
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  # ------------------------------------------------- build, scan, publish
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Both images are scanned even if one fails, so a single run reports
      # every vulnerability rather than stopping at the first.
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        id: img
        run: echo "name=${IMAGE_PREFIX,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # Loaded into the local daemon rather than pushed, so Trivy can
          # scan it *before* anything reaches the registry.
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          format: table
          # The build fails on any HIGH or CRITICAL finding. This is the
          # security gate, not a report.
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # Tagged with the commit SHA, not :latest, so every deployment is
          # traceable to the exact source that produced it.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha

  # -------------------------------------------------------------- deploy
  deploy:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no cluster is configured
        id: guard
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG_DATA is not set; skipping the cluster deploy."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubectl
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - uses: azure/setup-helm@v4
        if: steps.guard.outputs.run == 'true'

      - name: Helm upgrade --install
        if: steps.guard.outputs.run == 'true'
        run: |
          PREFIX="${IMAGE_PREFIX,,}"
          helm upgrade --install campusdesk ./helm/campusdesk \
            --namespace campusdesk --create-namespace \
            --set backend.image.repository=${REGISTRY}/${PREFIX}/backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${REGISTRY}/${PREFIX}/frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 5m
