---
apiVersion: v1
data:
  campusdesk.json: |-
    {
      "title": "CampusDesk",
      "uid": "campusdesk",
      "tags": [
        "campusdesk"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Open issues by priority",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "campusdesk_issues_open",
              "legendFormat": "{{priority}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Issues reported (rate per 5m)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (category) (rate(campusdesk_issues_created_total[5m]))",
              "legendFormat": "{{category}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "HTTP request rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (handler) (rate(http_requests_total{job=\"campusdesk-backend\"}[5m]))",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Request latency (p95)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"campusdesk-backend\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Total open backlog",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(campusdesk_issues_open)",
              "legendFormat": "open",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Backend pods up",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up{job=\"campusdesk-backend\"})",
              "legendFormat": "pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Issues resolved (total)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(campusdesk_issues_resolved_total)",
              "legendFormat": "resolved",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      }
    }
