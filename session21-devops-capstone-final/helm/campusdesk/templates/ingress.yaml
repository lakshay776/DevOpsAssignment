{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "campusdesk.fullname" . }}
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
  # No rewrite-target here on purpose. The FastAPI routes are registered
  # *at* /api/... , so the prefix has to survive the hop. Stripping it (as a
  # backend mounted at / would need) makes every /api call 404.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # /api is listed first so it wins over the catch-all below.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "campusdesk.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "campusdesk.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
